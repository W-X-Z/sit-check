name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (SwiftPM)
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle .app and analyzer (swiftc direct)
        run: ./scripts/make-app.sh
      - name: Analyzer smoke test (empty database)
        run: |
          DB="$RUNNER_TEMP/smoke.sqlite"
          sqlite3 "$DB" "PRAGMA user_version;"
          build/sitcheck-analyze help | head -3
          build/sitcheck-analyze report --db "$DB"
          build/sitcheck-analyze replay --db "$DB" --still 20,30 --drift-k 2,3 --split 7
          build/sitcheck-analyze export "$RUNNER_TEMP/csv" --db "$DB"
          ls "$RUNNER_TEMP/csv"
      - name: Local signing identity keeps a stable code identity
        run: |
          KC=sitcheck-ci.keychain
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          SITCHECK_KEYCHAIN="$KC" ./scripts/make-signing-identity.sh
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          ./scripts/make-app.sh
          codesign -dr - build/SitCheck.app 2>&1 | tee "$RUNNER_TEMP/dr.txt"
          grep -q "certificate" "$RUNNER_TEMP/dr.txt"

  bundle-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Bundle .app and analyzer (swiftc direct, x86_64)
        run: |
          ./scripts/make-app.sh
          file build/SitCheck.app/Contents/MacOS/SitCheck build/sitcheck-analyze
      - name: Analyzer smoke test (empty database)
        run: |
          DB="$RUNNER_TEMP/smoke.sqlite"
          sqlite3 "$DB" "PRAGMA user_version;"
          build/sitcheck-analyze report --db "$DB"
