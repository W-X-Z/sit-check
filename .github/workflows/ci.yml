name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (SwiftPM)
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle .app (swiftc direct)
        run: ./scripts/make-app.sh

  bundle-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Bundle .app (swiftc direct, x86_64)
        run: ./scripts/make-app.sh && file build/SitCheck.app/Contents/MacOS/SitCheck
